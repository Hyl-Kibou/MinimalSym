[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
exclude = ["site*"]

[project]
name = "MinimalSym"
version = "0.9.0"
authors = [
    { name = "Sebastian Hernández", email = "s3b4s7i4nhg@gmail.com" }
]
description = "**MinimalSym** is a Python package for molecular symmetry analysis in **Atomic Simulation Environment** **(ASE)** `Atoms` objects, including structure symmetrization."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research"
    ]
requires-python = ">=3.9"
dependencies = [
    "ase",
    "numpy >= 1.23.4",
    "numba >= 0.58.0"
    ]

[project.optional-dependencies]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
  "mkdocs-glightbox"
]
dev = [
    "build",
    "pytest"
]
