[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "MinimalSym"
version = "0.5.0"
authors = [
    { name = "Sebastian Hernández", email = "s3b4s7i4nhg@gmail.com" }
]
description = "A program for molecular symmetry detection. Minimal version of MolSym library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research"
    ]
requires-python = ">=3.9"
dependencies = [
    "numpy >= 1.23.4",
    "numba >= 0.58.0"
    ]

[project.optional-dependencies]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]"
]
dev = [
    "ase",
    "build",
    "pytest"
]
