[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "MinimalSym"
version = "0.1.1"
authors = [
    { name = "Sebastian Hernández", email = "s3b4s7i4nhg@gmail.com" }
]
description = "A program for molecular symmetry detection. Minimal version of MolSym library."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Programming Language :: Python :: 3"
    ]
requires-python = ">=3.9"
dependencies = [
    "numpy >= 1.23.4",
    "ase",
    ]

